[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hold"
version = "0.1.0"
description = "Provably cheapest film shooting schedule optimizer with legality verdicts"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "ortools>=9.11",
    "google-adk==2.6.3",
    "google-genai>=1.10",
    "google-cloud-aiplatform>=1.60",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "confluent-kafka>=2.5",
    "hypothesis>=6.112",
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "mcp>=2.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["api"]

[tool.pytest.ini_options]
testpaths = ["api/tests"]
addopts = "-m 'not network'"
markers = [
    "network: marks tests that hit live URLs or fetch sources (deselected by default)",
    "slow: marks tests that take more than 10 seconds",
]
filterwarnings = [
    "error::DeprecationWarning",
    "error::PendingDeprecationWarning",
    # google-adk 2.6.3 deprecates its own config classes at import time; third party, last so it wins
    "ignore:.*BaseAgentConfig.*:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[dependency-groups]
dev = [
    "google-adk[eval]==2.6.3",
]
