name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api-lint:
    name: API lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff check api/
      - run: uv run mypy api/ --ignore-missing-imports

  api-test:
    name: API tests (pytest hermetic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      # scripts/verify_quotes.py reads PDFs with pdftotext; without it that test skips and the
      # shipped extractor is never exercised in CI (round ten, finding 1).
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: uv sync
      - run: uv run pytest api/tests -q -m "not network"

  residual:
    name: Residual (benchmark 8/8)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run pytest api/tests/test_bench_identity.py api/tests/test_residual.py api/tests/test_checker.py api/tests/test_bruteforce.py api/tests/test_props.py api/tests/test_symmetry.py -v
        env:
          HOLD_FAKE_EXTERNALS: "0"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-results
          path: bench/results.json

  web-check:
    name: Web (tsc + eslint + vitest + icons + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Every step below is unconditional. They were guarded on `web/package.json` existing while
      # the web app was still a plan, and that guard outlived its reason: once the file landed the
      # condition was always true, and a step that CAN skip is a gate that can go quiet without
      # anyone noticing. CI rule 2: a conditionally skipped test is a false green.
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npx tsc --noEmit
      - working-directory: web
        run: npx eslint .
      - working-directory: web
        run: npm run test
      # The app icon and the three PWA icons are one drawing, and they had already drifted apart:
      # the installed app was the stripboard while the web manifest still pointed at the camera
      # gate, so a phone with both showed two marks for one product. Nothing catches that by
      # reading code, so the generator is the source and this asserts the committed PNGs match it.
      - working-directory: web
        run: npm run icons:check
      - working-directory: web
        run: npm run build

  web-e2e:
    name: Web e2e (golden path, fake externals)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - run: uv sync
      - working-directory: web
        run: npm ci
      # The browsers Playwright drives. Both projects in playwright.config.ts are installed, so a
      # missing browser fails here with a clear message instead of inside a spec.
      - working-directory: web
        run: npx playwright install --with-deps chromium webkit
      # The app has to be built before uvicorn starts: api/main.py mounts web/dist/assets at
      # import time, so a server started against an unbuilt tree serves a dead mount for its
      # whole life. The Playwright webServer waits on /api/status before any spec runs.
      - working-directory: web
        run: npm run build
      - name: The golden path
        working-directory: web
        env:
          HOLD_FAKE_EXTERNALS: "1"
          HOLD_SOLVE_TIME_LIMIT_S: "20"
        run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/test-results
            web/playwright-report
          retention-days: 7

  em-dash-gate:
    name: Em-dash gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: bash scripts/no_em_dash.sh

  license-guard:
    name: License guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run python scripts/check_licenses.py

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bob-attribution:
    name: Bob attribution current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run pytest api/tests/test_bob_attribution.py api/tests/test_bob_lane_enforcement.py -v
