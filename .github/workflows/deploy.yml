name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build and deploy to Cloud Run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # Workload Identity Federation

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Until PLAN.md task 0.1 creates the GCP project and its secrets, the job passes with a
      # notice instead of failing every push. Nothing is deployed when the secrets are absent.
      - name: Check deploy credentials
        id: creds
        env:
          WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
        run: |
          if [ -z "$WIF_PROVIDER" ] || [ -z "$GCP_PROJECT" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy skipped: WIF_PROVIDER or GCP_PROJECT is not set (PLAN.md task 0.1). Nothing was deployed."
            echo "Deploy skipped: GCP secrets not set (PLAN.md task 0.1). Nothing was deployed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # Workload Identity Federation - no JSON key in the repo (task 0.1)
      - if: steps.creds.outputs.configured == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - if: steps.creds.outputs.configured == 'true'
        uses: google-github-actions/setup-gcloud@v2

      # Configure Docker for Artifact Registry
      - if: steps.creds.outputs.configured == 'true'
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      # Build and push image
      - name: Build and push
        if: steps.creds.outputs.configured == 'true'
        run: |
          IMAGE="us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/hold/hold:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      # The service URL is not the project-number form on this project (that form answers 404), so
      # the CORS origin is read from the service itself; empty on the very first deploy.
      - name: Resolve the service URL for CORS
        if: steps.creds.outputs.configured == 'true'
        id: url
        run: |
          URL="$(gcloud run services describe hold --project "${{ secrets.GCP_PROJECT }}" --region us-central1 --format='value(status.url)' 2>/dev/null || true)"
          echo "origin=${URL}" >> "$GITHUB_OUTPUT"
          echo "service url: ${URL:-<none yet>}"

      # Deploy to Cloud Run - exact flags from PLAN.md task 1.10 / D11
      - name: Deploy to Cloud Run
        if: steps.creds.outputs.configured == 'true'
        run: |
          IMAGE="us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/hold/hold:${{ github.sha }}"
          gcloud run deploy hold \
            --image "$IMAGE" \
            --project "${{ secrets.GCP_PROJECT }}" \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated \
            --no-cpu-throttling \
            --min-instances=1 \
            --max-instances=1 \
            --cpu=2 \
            --memory=2Gi \
            --concurrency=80 \
            --timeout=3600 \
            --session-affinity \
            --set-secrets="GEMINI_MODEL=GEMINI_MODEL:latest,GOOGLE_CLOUD_PROJECT=GOOGLE_CLOUD_PROJECT:latest,GOOGLE_CLOUD_LOCATION=GOOGLE_CLOUD_LOCATION:latest,GOOGLE_GENAI_USE_ENTERPRISE=GOOGLE_GENAI_USE_ENTERPRISE:latest,CONFLUENT_BOOTSTRAP=CONFLUENT_BOOTSTRAP:latest,CONFLUENT_API_KEY=CONFLUENT_API_KEY:latest,CONFLUENT_API_SECRET=CONFLUENT_API_SECRET:latest" \
            --set-env-vars="HOLD_ORIGIN=${{ steps.url.outputs.origin }}"
