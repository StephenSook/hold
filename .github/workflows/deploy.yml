name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build and deploy to Cloud Run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # Workload Identity Federation

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Workload Identity Federation - no JSON key in the repo (task 0.1)
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      # Configure Docker for Artifact Registry
      - run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      # Build and push image
      - name: Build and push
        run: |
          IMAGE="us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/hold/hold:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      # Deploy to Cloud Run - exact flags from PLAN.md task 1.10 / D11
      - name: Deploy to Cloud Run
        run: |
          IMAGE="us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/hold/hold:${{ github.sha }}"
          gcloud run deploy hold \
            --image "$IMAGE" \
            --project "${{ secrets.GCP_PROJECT }}" \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated \
            --no-cpu-throttling \
            --min-instances=1 \
            --max-instances=1 \
            --cpu=2 \
            --memory=2Gi \
            --concurrency=80 \
            --timeout=3600 \
            --session-affinity \
            --set-secrets="GEMINI_MODEL=GEMINI_MODEL:latest,GOOGLE_CLOUD_PROJECT=GOOGLE_CLOUD_PROJECT:latest,GOOGLE_CLOUD_LOCATION=GOOGLE_CLOUD_LOCATION:latest,GOOGLE_GENAI_USE_ENTERPRISE=GOOGLE_GENAI_USE_ENTERPRISE:latest,CONFLUENT_BOOTSTRAP=CONFLUENT_BOOTSTRAP:latest,CONFLUENT_API_KEY=CONFLUENT_API_KEY:latest,CONFLUENT_API_SECRET=CONFLUENT_API_SECRET:latest" \
            --set-env-vars="HOLD_ORIGIN=https://hold-${{ secrets.GCP_PROJECT_NUMBER }}-uc.a.run.app"
