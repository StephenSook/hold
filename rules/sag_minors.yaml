# SAG-AFTRA minor performer rules from the Young Performers Handbook (2020 edition excerpt under rules/sources/).
# Checked by api/tests/test_quotes.py. D4: cite or refuse. Where the handbook prints an em dash the quote
# writes a hyphen (this repo bans em dashes in its own text); the checker treats the two as equal.

- id: SAG_MINORS_P17_CUMULATIVE_JURISDICTION
  jurisdiction: SAG-AFTRA
  authority: SAG-AFTRA
  citation: SAG-AFTRA Young Performers Handbook, TV/Theatrical Contract Workday Rules
  title: The contract governs work hours nationwide unless the state is stricter
  quote: |
    The SAG-AFTRA contract governs minors' work hours
  source_url: https://www.bizparentz.org/wp-content/uploads/2021/07/SAGAFTRA-young_performers_handbook-2020.pdf
  valid_from: "2020-01-01"
  valid_to: null
  params: null
  verified: VERIFIED
  note: Display fact behind D5. The full sentence reads 'The SAG-AFTRA contract governs minors' work hours everywhere in the United States unless stricter work hours are mandated by the state'; the PDF text extraction interleaves the two columns, so only the contiguous fragment is machine-checked.

- id: SAG_MINORS_WORKDAY_CURFEW
  jurisdiction: SAG-AFTRA
  authority: SAG-AFTRA
  citation: SAG-AFTRA Young Performers Handbook, TV/Theatrical Contract Workday Rules
  title: Not before 5 a.m., not after 10 p.m. before a school day; 12:30 a.m. before a non-school day
  quote: |
    Minors may not work before 5 a.m. or after 10 p.m. on evenings preceding a school day
    (workdays must end by 12:30 a.m. on the morning of non-school days).
  source_url: https://www.bizparentz.org/wp-content/uploads/2021/07/SAGAFTRA-young_performers_handbook-2020.pdf
  valid_from: "2020-01-01"
  valid_to: null
  params:
    earliest_call: "05:00"
    curfew_school_night: "22:00"
    curfew_non_school_night: "00:30"
  verified: VERIFIED
  note: Young Performers Handbook, 2020 edition (TV/Theatrical Contract Workday Rules). Applies to every minor on a SAG-AFTRA production.

- id: SAG_MINORS_P22_TURNAROUND_SCHOOL_DAY
  jurisdiction: SAG-AFTRA
  authority: SAG-AFTRA
  citation: SAG-AFTRA Young Performers Handbook, TV/Theatrical Contract Workday Rules
  title: Final workday ends at least 12 hours before the next regular school day
  quote: |
    The minor's final workday must be concluded at least 12 hours before the beginning of the
    minor's next regular school day.
  source_url: https://www.bizparentz.org/wp-content/uploads/2021/07/SAGAFTRA-young_performers_handbook-2020.pdf
  valid_from: "2020-01-01"
  valid_to: null
  params:
    min_turnaround_hours: 12
  verified: VERIFIED
  note: HOLD applies it when the checked day is a school day and measures to that day's crew call, which is where an on-set school day begins.

