- id: CA_11760_e_location_hours_9_15
  jurisdiction: CA
  authority: California Department of Industrial Relations (8 CCR, Title 8)
  citation: 8 CCR 11760(e)
  title: Minor ages 9 to 15: 9 hours at the place of employment
  quote: |
    Minors who have reached the age of nine (9) years but who have not attained the age of
    sixteen (16) years may be permitted at the place of employment for a maximum of nine (9)
    hours.
  source_url: https://www.dir.ca.gov/t8/11760.html
  valid_from: "1986-04-03"
  valid_to: null
  params:
    max_location_hours: 9
    age_min: 9
    age_max: 15
  verified: VERIFIED
  note: Effective date from the section history (amendment filed 3-4-86, effective the thirtieth day thereafter).

- id: CA_11760_e_work_hours_9_15_school_day
  jurisdiction: CA
  authority: California Department of Industrial Relations (8 CCR, Title 8)
  citation: 8 CCR 11760(e)
  title: Minor ages 9 to 15: 5 hours of work when school is in session
  quote: |
    Minors who have reached the age of nine (9) years but who have not attained the age of
    sixteen (16) years may be permitted at the place of employment for a maximum of nine (9)
    hours. Such nine (9)-hour period shall consist of not more than five (5) hours of work and
    at least three (3) hours of schooling when the minor's school is in session.
  source_url: https://www.dir.ca.gov/t8/11760.html
  valid_from: "1986-04-03"
  valid_to: null
  params:
    max_work_hours_school_day: 5
    age_min: 9
    age_max: 15
  verified: VERIFIED
  note: The DLSE subtract-6 policy (separate record) reads this as 3 hours of work for tutored minors on a school day.

