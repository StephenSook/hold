- id: CA_1308_7_daily_cap_8_hours
  jurisdiction: CA
  authority: California Legislature
  citation: Cal. Lab. Code 1308.7(a)
  title: Minor daily cap: 8 hours of work in one day
  quote: |
    No minor shall be employed in the entertainment industry more than eight hours in one day of
    24 hours, or more than 48 hours in one week, or before 5 a.m., or after 10 p.m. on any day
    preceding a schoolday. However, a minor may work the hours authorized by this section during
    any evening preceding a nonschoolday until 12:30 a.m. of the nonschoolday.
  source_url: https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?sectionNum=1308.7.&lawCode=LAB
  valid_from: "1993-09-28"
  valid_to: null
  params:
    max_work_hours_day: 8
  verified: VERIFIED
  note: Statutory cap on top of the 8 CCR 11760 tables. Effective date from the section note (Stats. 1993, Ch. 570).

