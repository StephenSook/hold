- id: CA_11755_2_studio_teacher_ratios
  jurisdiction: CA
  authority: California Department of Industrial Relations (8 CCR, Title 8)
  citation: 8 CCR 11755.2
  title: Studio teacher 1 per 10 minors (1 per 20 on non-school days for minors under 16)
  quote: |
    One (1) studio teacher must be provided for each group of ten (10) minors or fraction
    thereof. With respect to minors age fifteen (15) days to age sixteen (16), one (1) studio
    teacher must be provided for each group of twenty (20) minors or fraction thereof on
    Saturdays, Sundays, holidays, or during school vacation periods.
  source_url: https://www.dir.ca.gov/t8/11755_2.html
  valid_from: "1997-12-02"
  valid_to: null
  params:
    teacher_per_minors: 10
    teacher_per_minors_non_school_under_16: 20
  verified: VERIFIED
  note: Display fact; renumbered from 11755.1 on 12-2-97 per the section history.

- id: CA_11761_meal_period
  jurisdiction: CA
  authority: California Department of Industrial Relations (8 CCR, Title 8)
  citation: 8 CCR 11761
  title: Meal period excluded from hours; extends the day by at most 30 minutes
  quote: |
    All hours for the minor at the place of employment are exclusive of the meal period. The
    working day may not be extended by a meal period longer than one half (1/2) hour.
  source_url: https://www.dir.ca.gov/t8/11761.html
  valid_from: "1986-04-03"
  valid_to: null
  params:
    max_meal_extension_minutes: 30
  verified: VERIFIED
  note: Display fact. California's six-hour meal timing is not in this section; the six-hour rule HOLD enforces is Georgia's 300-7-1-.03(2)(c).

- id: CA_11756_out_of_state_basis
  jurisdiction: CA
  authority: California Department of Industrial Relations (8 CCR, Title 8)
  citation: 8 CCR 11756
  title: California rules follow California-resident minors to another state
  quote: |
    When minors resident in the State of California and employed by an employer in the
    entertainment industry located in the State of California, are taken from the State of
    California to work on location in another state, as part of, and pursuant to, contractual
    arrangements made in the State of California for their employment in the entertainment
    industry, the child labor laws of California and the regulations based thereon shall be
    applicable, including, but not limited to, the requirement that a studio teacher must be
    provided for such minor in accordance with Section 11755.1.
  source_url: https://www.dir.ca.gov/t8/11756.html
  valid_from: "1986-04-03"
  valid_to: null
  params: null
  verified: VERIFIED
  note: Basis for D5 on a Georgia shoot with a California-resident minor. HOLD assumes a California employer and a California contract; if that is not the case, the CA records do not apply and the README honesty panel says so.

- id: CA_DLSE_SUBTRACT_6_POLICY
  jurisdiction: CA
  authority: California Division of Labor Standards Enforcement
  citation: DLSE, Minors Summary Charts: Hours of Work (Attendance and Work Hours)
  title: DLSE subtract-6 policy for tutored minors on a school day
  quote: |
    Compute work hours for each age group by subtracting 6 hours from the max time at employment
    site for tutored minors when school in session. The difference is the maximum work hours for
    these minors.
  source_url: https://www.dir.ca.gov/dlse/MinorsSummaryCharts_HoursofWork.pdf
  valid_from: "2000-01-01"
  valid_to: null
  params:
    school_hours_to_subtract: 6
  verified: VERIFIED
  note: Separately flagged enforcement layer (PLAN.md 2.2), display only in pass 1. The chart continues: 9 to 16 year-olds who attend regular school may only work up to 3 hours on a schoolday (row label interleaved in the text extraction, so not machine-checked). The chart carries no date; valid_from is a placeholder and is stated as such.

