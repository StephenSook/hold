- id: GA_300_7_1_03_ages_9_15_location_hours
  jurisdiction: GA
  authority: Georgia Department of Labor
  citation: Ga. Comp. R. & Regs. 300-7-1-.03(2)(a)
  title: Minor ages 9-15 max hours at location per day
  quote: |
    Minors who are between the ages of nine (9) and fifteen (15) years old: ten (10) hours
    at the place of employment in any one day.
  source_url: https://rules.sos.ga.gov/gac/300-7-1
  valid_from: "2010-01-01"
  valid_to: null
  params:
    max_location_hours: 10
    age_min: 9
    age_max: 15
  verified: PENDING
  note: null

