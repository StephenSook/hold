- id: GA_300_7_1_03_ages_9_15_location_hours
  jurisdiction: GA
  authority: Georgia Department of Labor
  citation: Ga. Dept. of Labor, Schedule of Hours of Performance, (g)(1), incorporated by Ga. Comp. R. & Regs. 300-7-1-.03(2)(a)
  title: Minor ages 9 to 15: 10 hours at the Location per day
  quote: |
    May be at the Location up to 10 hours per day and no later than 10:00 p.m. on a school night
    and 12:00 midnight on a non-school night.
  source_url: https://dol.georgia.gov/document/child-labor/schedule-hours-performance/download
  valid_from: "2020-01-30"
  valid_to: null
  params:
    max_location_hours: 10
    age_min: 9
    age_max: 15
  verified: VERIFIED
  note: The rule text incorporates the Department form (300-7-1-.03(2)(a)); the hours live on the form, not in the rule.

