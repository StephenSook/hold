- id: GA_300_7_1_02_location_time_definition
  jurisdiction: GA
  authority: Georgia Department of Labor
  citation: Ga. Comp. R. & Regs. 300-7-1-.02(1)(m)
  title: Location Time defined (meals, tutoring and breaks count)
  quote: |
    Location Time: The total time the Minor is on the Location of the Employing Unit including,
    but not limited to, work time, meal time, tutoring time, break time, and any other time
    spent at the Location regardless of the reason.
  source_url: https://rules.sos.ga.gov/gac/300-7-1
  valid_from: "2020-01-30"
  valid_to: null
  params: null
  verified: VERIFIED
  note: Display fact; HOLD's location hours follow this definition (call to dismissal, meal included).

