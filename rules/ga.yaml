- id: GA_300_7_1_03_consecutive_days
  jurisdiction: GA
  authority: Georgia Department of Labor
  citation: Ga. Comp. R. & Regs. 300-7-1-.03(2)(e)
  title: No more than six consecutive days
  quote: |
    No Minor shall work more than six (6) consecutive days.
  source_url: https://rules.sos.ga.gov/gac/300-7-1
  valid_from: "2020-01-30"
  valid_to: null
  params:
    max_consecutive_days: 6
  verified: VERIFIED
  note: Counted over the days the minor worked; the form (i)(4) makes the Representative responsible for the count.

- id: GA_300_7_1_03_turnaround_school_hours
  jurisdiction: GA
  authority: Georgia Department of Labor
  citation: Ga. Comp. R. & Regs. 300-7-1-.03(5)(a)
  title: 12 hours between dismissal and next call when working during school hours
  quote: |
    When any Minor between ages four (4) and eighteen (18) works during school hours, twelve
    (12) hours must elapse between the Minor's time of dismissal and time of call on the
    following day; or if the Minor is not working the next day, the start of the Minor's regular
    school day.
  source_url: https://rules.sos.ga.gov/gac/300-7-1
  valid_from: "2020-01-30"
  valid_to: null
  params:
    min_turnaround_hours: 12
    age_min: 4
    age_max: 17
  verified: VERIFIED
  note: HOLD applies it when the checked day is a school day (school_day true) and measures to the crew call of that day.

- id: GA_300_7_1_03_first_meal_within_6_hours
  jurisdiction: GA
  authority: Georgia Department of Labor
  citation: Ga. Comp. R. & Regs. 300-7-1-.03(2)(c)
  title: First meal within 6 hours of start, next meal within 7 hours of the previous meal start
  quote: |
    Meal periods are not work time. Meal time may be scheduled at the end of the day as long as
    the first meal is within six (6) hours of start time and subsequent meals are no more than
    seven (7) hours after the start of the previous meal period.
  source_url: https://rules.sos.ga.gov/gac/300-7-1
  valid_from: "2020-01-30"
  valid_to: null
  params:
    max_work_before_meal_hours: 6
    next_meal_within_hours_of_previous_start: 7
    min_meal_duration_minutes: 30
  verified: VERIFIED
  note: Timing-only: judged on a concrete call sheet, never on the crew window. The 30-minute minimum is the form's alternative at (g)(3)(i) ('30-minute meal break'); HOLD models one crew meal per day.

