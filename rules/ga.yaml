- id: GA_300_7_1_03_school_night_curfew
  jurisdiction: GA
  authority: Georgia Department of Labor
  citation: Ga. Comp. R. & Regs. 300-7-1-.03(2)(a)
  title: Minor ages 9-15 school night curfew 10 PM
  quote: |
    Minors who are between the ages of nine (9) and fifteen (15) years old shall not be
    permitted to work later than 10:00 p.m. on any night preceding a school day.
  source_url: https://rules.sos.ga.gov/gac/300-7-1
  valid_from: "2010-01-01"
  valid_to: null
  params:
    curfew_school_night: "22:00"
    age_min: 9
    age_max: 15
  verified: PENDING
  note: The demo schedule illegal day (2026-10-08, school_day=true) violates this rule.

