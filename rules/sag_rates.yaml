- id: SAG_RATES_MEAL_PERIOD_6_HOURS
  jurisdiction: SAG-AFTRA
  authority: SAG-AFTRA
  citation: SAG-AFTRA Help Center, How do Theatrical meal periods work? (answer 999)
  title: First meal within six hours of first call, each meal at least thirty minutes
  quote: |
    The performer must be given the first meal break within six hours from the time of first
    call. The second meal break must be called within six hours from the time of call back from
    the first meal break. Each meal break must be no less than thirty minutes, but the Producer
    can deduct actual time up to one hour spent at meals.
  source_url: https://servicesagaftra.custhelp.com/app/answers/detail/a_id/999
  valid_from: "2026-07-01"
  valid_to: null
  params:
    kind: penalty
    meal_within_minutes: 360
    min_meal_minutes: 30
  verified: VERIFIED
  note: null

