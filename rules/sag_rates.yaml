- id: SAG_RATES_CONSECUTIVE_EMPLOYMENT_LOW_BUDGET
  jurisdiction: SAG-AFTRA
  authority: SAG-AFTRA (SAGindie, the union's low-budget program)
  citation: SAGindie FAQ, What does No Consecutive Employment mean
  title: Low-budget agreements: intervening days are not paid, except on an overnight location
  quote: |
    Under the Basic Agreement producers are required to pay consecutive employment. This means
    that if an actor works on Monday and Wednesday the producer not only has to pay them for
    these days, but also for the “consecutive” day of Tuesday. Under all of the low budget
    agreements, there is no consecutive employment, so if an actor only works Monday and
    Wednesday, the producer only has to pay them (or defer their pay) for Monday and Wednesday.
    However, if your performer is working on an overnight location, you DO have to pay them the
    consecutive day.
  source_url: https://www.sagindie.org/resources/faq/
  valid_from: "2026-07-01"
  valid_to: null
  params:
    hold_days_paid: "overnight_location_only"
  verified: VERIFIED
  note: This conditions the hold-day cost: under the low-budget tiers a hold day costs a day's pay only on an overnight location (ScheduleInput.overnight_location). The Basic Agreement pays consecutive employment everywhere.

- id: SAG_RATES_HOLD_DAY_FULL_RATE
  jurisdiction: SAG-AFTRA
  authority: SAG-AFTRA (SAGindie, the union's low-budget program)
  citation: SAGindie FAQ, What does No Consecutive Employment mean
  title: A paid hold day is the consecutive day's pay
  quote: |
    However, if your performer is working on an overnight location, you DO have to pay them the
    consecutive day.
  source_url: https://www.sagindie.org/resources/faq/
  valid_from: "2026-07-01"
  valid_to: null
  params:
    hold_day_rate_multiplier: 1.0
  verified: VERIFIED
  note: The economic fact the solver minimizes, on an overnight location under the low-budget tiers; the day's pay is the tier's daily minimum plus P&H. assumption: 1.0 (the FAQ says the consecutive day is paid and names no multiplier, so the tier day rate is taken at face value). HOLD counts every calendar day between a performer's first and last working day that they do not work, listed as a shoot day or not; the FAQ states the unlisted-weekday case (Monday and Wednesday pays Tuesday) and a weekend inside the span is counted the same way, which is HOLD's reading.

- id: SAG_RATES_BASIC_CONSECUTIVE_EMPLOYMENT
  jurisdiction: SAG-AFTRA
  authority: SAG-AFTRA
  citation: SAG-AFTRA, Consecutive Employment (Theatrical Basic Agreement summary)
  title: Basic Agreement: performers are paid on a consecutive basis, with a firm pick-up exception
  quote: |
    Performers shall be paid on a consecutive basis from the first day they are instructed to
    report for work, subject to the following:

    Day Performers:

    If, at the time of original engagement, the day performer is given a firm pick-up date which
    is more than 10 calendar days (for films shooting entirely in the USA) or 14 calendar days
    (for all other films) after the close of his initial employment, compensation need not be
    paid for the intervening time.
  source_url: https://www.sagaftra.org/consecutive-employment
  valid_from: "2026-07-01"
  valid_to: null
  params:
    hold_days_paid: "consecutive"
    firm_pickup_gap_days_usa: 10
    firm_pickup_gap_days_other: 14
  verified: VERIFIED
  note: The page answers HTTP 403 to scripted fetches; the snapshot is the page's main text as rendered in Chrome on 2026-09-03 (header states the capture and a sha256 of the text). The firm pick-up exception is not modeled; under the Basic Agreement tier the solver counts every calendar day between a performer's first and last working day as paid.

- id: SAG_RATES_REST_PERIOD_12_HOURS
  jurisdiction: SAG-AFTRA
  authority: SAG-AFTRA
  citation: SAG-AFTRA, Rest Periods (Forced Calls), Daily Rest Periods, Studio Zone
  title: 12-hour rest period from dismissal to the next day's first call
  quote: |
    The performer is entitled to a 12 hour rest period from the time he is dismissed until the
    first call for the next day. This applies for makeup, wardrobe, hairdress, or any other
    purpose.
  source_url: https://www.sagaftra.org/rest-periods-forced-calls-5
  valid_from: "2026-07-01"
  valid_to: null
  params:
    kind: penalty
    rest_hours: 12
  verified: VERIFIED
  note: The page's reductions (10 hours on a location day outside the studio zone, 11 hours on two non-consecutive overnight-location days) are not modeled; the strict figure is used.

