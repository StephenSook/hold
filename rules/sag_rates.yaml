- id: SAG_RATES_HOLD_DAY_FULL_RATE
  jurisdiction: SAG-AFTRA
  authority: SAG-AFTRA
  citation: SAG-AFTRA 2026 Agreement, General Provisions, Hold Days
  title: Hold day billed at full daily rate
  quote: |
    When a performer is held and not working, the employer shall pay the performer the
    full daily minimum rate for each hold day.
  source_url: https://www.sagaftra.org/production-center/contract/856/minimum-rates
  valid_from: "2026-01-01"
  valid_to: null
  params:
    hold_day_rate_multiplier: 1.0
  verified: PENDING
  note: This is the core economic fact the solver minimizes. Hold days = full daily rate.
